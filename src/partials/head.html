<script>
  /* Sprache vor dem ersten Rendern setzen (kein Aufblitzen): ?lang= > gespeicherte Wahl > Browsersprache > Deutsch */
  (function () {
    var L = ['de', 'en', 'it'], l = 'de', d = document.documentElement;
    try {
      var q = new URLSearchParams(location.search).get('lang');
      var s = localStorage.getItem('sr-lang');
      var n = (navigator.language || 'de').slice(0, 2).toLowerCase();
      l = L.indexOf(q) > -1 ? q : L.indexOf(s) > -1 ? s : L.indexOf(n) > -1 ? n : 'de';
    } catch (e) {}
    d.lang = l; d.setAttribute('data-lang', l);
    if (l !== 'de') { d.classList.add('i18n-pending'); setTimeout(function () { d.classList.remove('i18n-pending'); }, 1800); }
  })();
</script>
